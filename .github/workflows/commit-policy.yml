name: Commit policy

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  commit-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: Check commit attribution
        run: node scripts/check-commit-message.mjs --all
