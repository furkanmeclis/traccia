name: CI

permissions:
  contents: read

# Verify every pushed branch; this workflow never merges or deploys.
on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: traccia_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: traccia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traccia_test -d traccia_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://traccia_test:synthetic_ci_only@127.0.0.1:5432/traccia_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: sqlc generate
        run: sqlc generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
      - name: Database extensions
        env:
          PGPASSWORD: synthetic_ci_only
        run: psql -h 127.0.0.1 -U traccia_test -d traccia_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public; CREATE EXTENSION IF NOT EXISTS citext WITH SCHEMA public;'
      - name: Test
        run: go test ./...
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1 lint docs/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # pnpm 11 needs the project Node runtime before setup-node queries its store.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Submission tests
        run: node --test src/features/workspaces/*.test.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: i18n
        working-directory: .
        run: node scripts/check-i18n.mjs

