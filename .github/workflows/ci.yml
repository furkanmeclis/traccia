name: CI

permissions:
  contents: read

# Verify every pushed branch; this workflow never merges or deploys.
on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: traccia_test
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: traccia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traccia_test -d traccia_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://traccia_test:synthetic_ci_only@127.0.0.1:5432/traccia_test?sslmode=disable
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_BUCKET: traccia-attachment-ci
      MINIO_ACCESS_KEY: traccia_ci_only
      MINIO_SECRET_KEY: synthetic_object_store_ci_only
      MINIO_USE_PATH_STYLE: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - name: sqlc generate
        run: sqlc generate
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
      - name: Database extensions
        env:
          PGPASSWORD: synthetic_ci_only
        run: psql -h 127.0.0.1 -U traccia_test -d traccia_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public; CREATE EXTENSION IF NOT EXISTS citext WITH SCHEMA public;'
      # Official container tags and binary archives are no longer available.
      # Build only this test fixture from immutable upstream source commits.
      - name: Build isolated MinIO fixture
        env:
          GOBIN: ${{ runner.temp }}/traccia-storage-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/minio/minio@07c3a429bfed433e49018cb0f78a52145d4bedeb
          go install github.com/minio/mc@7394ce0dd2a80935aded936b09fa12cbb3cb8096
      - name: Start isolated MinIO fixture
        env:
          MINIO_ROOT_USER: traccia_ci_only
          MINIO_ROOT_PASSWORD: synthetic_object_store_ci_only
          MC_CONFIG_DIR: ${{ runner.temp }}/traccia-mc
        run: |
          mkdir -p "$RUNNER_TEMP/traccia-storage-data"
          "$RUNNER_TEMP/traccia-storage-bin/minio" server "$RUNNER_TEMP/traccia-storage-data" --address 127.0.0.1:9000 --console-address 127.0.0.1:9001 > "$RUNNER_TEMP/traccia-minio.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/traccia-minio.pid"
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          "$RUNNER_TEMP/traccia-storage-bin/mc" alias set fixture http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          "$RUNNER_TEMP/traccia-storage-bin/mc" mb fixture/traccia-attachment-ci
      - name: Test
        run: go test ./...
      - name: Stop isolated MinIO fixture
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/traccia-minio.pid"; then kill "$(cat "$RUNNER_TEMP/traccia-minio.pid")" || true; fi
      - name: Product contract drift and schema fixtures
        run: |
          node --test ../scripts/product-schema.test.mjs
          node ../scripts/sync-product-openapi.mjs --check
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1 lint docs/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # pnpm 11 needs the project Node runtime before setup-node queries its store.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generated API types are current
        run: |
          pnpm api:generate
          git diff --exit-code -- src/generated/api.d.ts
      - name: Recursive document API generator regressions
        run: node --test ../scripts/product-schema-integration.test.mjs
      - name: All product regressions
        run: |
          node --test ../scripts/product-test-discovery.test.mjs
          node ../scripts/run-product-tests.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: i18n
        working-directory: .
        run: node scripts/check-i18n.mjs
