      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/sessions/revoke-others:
    post:
      tags: [Auth]
      operationId: revokeOtherAuthSessions
      summary: Revoke other sessions
      description: Signs out every session except the current one.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Remaining current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sessions/{uuid}:
    delete:
      tags: [Auth]
      operationId: revokeAuthSession
      summary: Revoke a session
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant/context:
    get:
      tags: [Tenant]
      operationId: getTenantContext
      summary: Current organization scope
      description: |
        Resolves the organization named by `X-Organization` and the caller's
        membership in it, and returns what tenant routes see: the organization,
        the caller's tenant role and its `tenant.*` permissions in this
        organization only. Mounted only when `TENANCY_ENABLED=true`.

        Errors: missing header → `400 ORGANIZATION_REQUIRED`; unknown
        organization or no membership → `403 NO_TENANT_MEMBERSHIP` (same
        answer for both; `super_admin` is not exempt); suspended →
        `403 ORGANIZATION_SUSPENDED`; outside the access window →
        `403 ORGANIZATION_ACCESS_EXPIRED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganization"
      responses:
        "200":
          description: Organization scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantContext"
        "400":
          $ref: "#/components/responses/OrganizationRequired"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/TenantForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XOrganization:
      name: X-Organization
      in: header
      required: true
      description: |
        Organization of a `/v1/tenant/*` request: its slug (preferred, readable
        in logs) or uuid. The BFF forwards it on `/api/v1/tenant/*` only.
      schema: { type: string, maxLength: 64, example: acme }
    QRSessionID:
      name: id
      in: path
      required: true
      description: QR sign-in session id (from the QR URL)
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
    ResourceUUID:
      name: uuid
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    UserUUID:
      name: userUuid
      in: path
      required: true
      description: User UUID
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix `-` for descending
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OrganizationRequired:
      description: "`ORGANIZATION_REQUIRED`: the `X-Organization` header is missing or empty"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TenantForbidden:
      description: |
        `NO_TENANT_MEMBERSHIP` (unknown organization or not a member),
        `ORGANIZATION_SUSPENDED`, `ORGANIZATION_ACCESS_EXPIRED`, or `FORBIDDEN`
        (tenant permission missing in this organization)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    TenantOrganization:
      type: object
      required: [uuid, slug, name, status, access_ends_at]
      properties:
        uuid: { type: string, format: uuid }
        slug: { type: string, example: acme }
        name: { type: string, example: Acme }
        status: { type: string, enum: [active, suspended] }
        access_ends_at:
          type: [string, "null"]
          format: date-time
          description: End of the access window; `null` = no end

    TenantContext:
      type: object
      required: [organization, role, permissions]
      properties:
        organization: { $ref: "#/components/schemas/TenantOrganization" }
        role:
          type: string
          description: Caller's tenant role key in this organization (`owner`, `admin`, `member` or a custom key)
          example: owner
        permissions:
          type: array
          description: "`tenant.*` permission slugs granted in this organization only"
          items: { type: string }

    EnvelopeTenantContext:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TenantContext" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    SearchSpec:
      type: object
      required: [id, label_key]
      properties:
        id: { type: string, example: users }
        label_key: { type: string, example: search.specs.users }
        permission: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        searchable_fields:
          type: array
          items: { type: string }
        filterable_fields:
          type: array
          items: { type: string }

    SearchHit:
      type: object
      required: [spec, id, title, href]
      properties:
        spec: { type: string }
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        href: { type: string }
        icon: { type: [string, "null"] }
        score: { type: [number, "null"], format: double }

    SearchSpecsData:
      type: object
      required: [items, enabled]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchSpec" }
        enabled: { type: boolean }

    SearchHitsData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }

    EnvelopeSearchSpecs:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchSpecsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSearchHits:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchHitsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    PushDeviceInput:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          description: Expo push token (`ExponentPushToken[...]` or `ExpoPushToken[...]`)
          example: "ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"
        platform: { type: string, enum: [ios, android] }
        locale:
          type: string
          description: Device locale (`tr`, `en`, `tr-TR`, ...); stored as `tr` | `en` | empty
          example: tr-TR
        app_version: { type: string, maxLength: 32, example: "1.4.0 (57)" }
        device_name: { type: string, maxLength: 120, example: "iPhone 16" }

    PushDevice:
      type: object
      required: [uuid, token, platform, locale, app_version, device_name, last_seen_at, created_at]
      properties:
        uuid: { type: string, format: uuid }
        token: { type: string }
        platform: { type: string, enum: [ios, android] }
        locale: { type: string, enum: [tr, en, ""] }
        app_version: { type: string }
        device_name: { type: string }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    PushDeviceRegistration:
      type: object
      required: [device, push_enabled]
      properties:
        device: { $ref: "#/components/schemas/PushDevice" }
        push_enabled:
          type: boolean
          description: Current `push_enabled` preference of the user

    EnvelopePushDeviceRegistration:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/PushDeviceRegistration" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeStatusOK:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [ok] }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field: { type: string }
        message: { type: string }
        code: { type: string }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
