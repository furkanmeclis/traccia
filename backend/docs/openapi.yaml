      responses:
        "200":
          description: Impersonation session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeImpersonationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/impersonation/stop:
    post:
      tags: [Auth]
      operationId: postAuthImpersonationStop
      summary: Stop impersonation
      description: Restores the original actor session when the access token includes an impersonator claim.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Impersonation stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeImpersonationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/realtime/connection-token:
    post:
      tags: [Realtime]
      operationId: postRealtimeConnectionToken
      summary: Issue Centrifugo connection JWT
      description: |
        Returns `{ token, expires_at, ws_url }`. JWT `sub` is the user UUID string.
        Requires `auth.session`. Disabled Centrifugo → `503 REALTIME_DISABLED`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connection token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRealtimeConnectionToken"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Realtime disabled
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/realtime/subscription-token:
    post:
      tags: [Realtime]
      operationId: postRealtimeSubscriptionToken
      summary: Issue Centrifugo subscription JWT
      description: |
        Body `{ channel }`. Allowlist `user:{own_uuid}`, member `workspace:{uuid}`,
        and `conversation:{uuid}` (authenticated session; HTTP inbox ACL is the hard boundary).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeSubscriptionTokenRequest"
      responses:
        "200":
          description: Subscription token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRealtimeSubscriptionToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Realtime disabled
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/profile:
    patch:
      tags: [Auth]
      operationId: patchAuthProfile
      summary: Update own profile
      description: Partial update of name/surname. Email/password/status/roles are not changeable here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProfileRequest"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: postAuthPasswordForgot
      summary: Request password reset
      description: Always returns accepted. If the email exists, enqueues a reset OTP email via Notification Center.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: postAuthPasswordReset
      summary: Reset password with OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/password/change:
    post:
      tags: [Auth]
      operationId: postAuthPasswordChange
      summary: Change password
      description: Verifies current password, sets a new one, and revokes all refresh tokens (including the current session).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/email/verify-request:
    post:
      tags: [Auth]
      operationId: postAuthEmailVerifyRequest
      summary: Request email verification OTP
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/email/verify:
    post:
      tags: [Auth]
      operationId: postAuthEmailVerify
      summary: Verify email with OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/email-code/request:
    post:
      tags: [Auth]
      operationId: postAuthEmailCodeRequest
      summary: Request an email sign-in code
      description: |
        Emails a 6-digit one-time sign-in code (valid 10 minutes, 5 attempts,
        single use, stored hashed). The response is identical whether or not the
        email belongs to an account. Rate limited per IP and per email.

        Unknown email: when self-registration is enabled
        (`auth_settings.registration_enabled`) a sign-up code is sent as well
        and `/v1/auth/email-code/verify` creates the account. When it is
        disabled no email is sent (same response).

        App review: emails listed in `AUTH_REVIEW_ACCOUNTS` receive no email;
        their fixed code works for that email only.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeRequest"
      responses:
        "200":
          description: Accepted (always, for any well-formed email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/email-code/verify:
    post:
      tags: [Auth]
      operationId: postAuthEmailCodeVerify
      summary: Sign in with an email code
      description: |
        Exchanges an email code for the same token pair as `/v1/auth/login`.
        When the user has authenticator 2FA, a call without `totp_code` returns
        `403 MFA_REQUIRED` and the email code stays valid; retry with the same
        `code` plus `totp_code`. A wrong `totp_code` (`401 INVALID_MFA_CODE`)
        counts against the code's 5 attempts.

        Sign-up: for an email without an account, when self-registration is
        enabled, a valid code creates the user (email verified, no password,
        `name` = email local part, empty `surname`, default role) and returns
        tokens like a normal login. With registration disabled an unknown email gets
        `400 INVALID_EMAIL_CODE`.

        Errors: `400 INVALID_EMAIL_CODE` (wrong / expired / used / exhausted),
        `403 MFA_REQUIRED`, `401 INVALID_MFA_CODE`, `403 ACCOUNT_DEACTIVATED`,
        `403 FORBIDDEN` (disabled by an admin), `403 NO_TENANT_MEMBERSHIP`,
        `429 RATE_LIMITED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailCodeVerifyRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/oauth/{provider}/native:
    post:
      tags: [Auth]
      operationId: postAuthOAuthNative
      summary: Sign in with a native Apple / Google id_token
      description: |
        For mobile apps using the platform SDKs. The `id_token` signature is
        verified against the provider JWKS (cached), plus `iss`, `exp`, `aud`
        (Apple: `AUTH_APPLE_NATIVE_CLIENT_IDS`;
        Google: `AUTH_GOOGLE_NATIVE_CLIENT_IDS` plus the web client id from
        OAuth settings) and `nonce` when sent (raw nonce, or its hex SHA-256
        in the token).

        - Identity already linked → tokens (same shape as `/v1/auth/login`,
          including the `MFA_REQUIRED` / `totp_code` round-trip).
        - Not linked, an account with the same email exists →
          `409 OAUTH_ACCOUNT_NOT_LINKED` (same policy as the web: sign in with
          the existing method and link from the profile).
        - Not linked, Apple private-relay email (`@privaterelay.appleid.com`),
          no account → `409 OAUTH_LINK_CHOICE_REQUIRED`; `error.details`
          carries `link_ticket`, `provider`, `expires_in` (seconds, 900) and
          `register_allowed` (`"true"`/`"false"`). Continue with
          `/v1/auth/oauth/link/*`.
        - Not linked, no account → the account is created (OAuth sign-up; needs
          registration enabled, else `403 FORBIDDEN`) and tokens returned.

        Apple: send `authorization_code` so the server can store a refresh
        token (revoked on account deletion; needs `AUTH_APPLE_*` key config),
        and `given_name` / `family_name` on the first sign-in.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [apple, google]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeOAuthRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "`INVALID_ID_TOKEN` or `INVALID_MFA_CODE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`MFA_REQUIRED`, `ACCOUNT_DEACTIVATED`, `OAUTH_PROVIDER_DISABLED`, `FORBIDDEN`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`OAUTH_ACCOUNT_NOT_LINKED` or `OAUTH_LINK_CHOICE_REQUIRED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                success: false
                error:
                  code: OAUTH_LINK_CHOICE_REQUIRED
                  message: Choose whether to link this sign-in to an existing account or create a new one
                  details:
                    - { field: link_ticket, message: "<opaque>" }
                    - { field: provider, message: apple }
                    - { field: expires_in, message: "900" }
                    - { field: register_allowed, message: "true" }
                meta: { request_id: "00000000-0000-0000-0000-000000000000" }
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/oauth/link/request:
    post:
      tags: [Auth]
      operationId: postAuthOAuthLinkRequest
      summary: Email a link code to an existing account
      description: |
        "Yes, I have an account": emails a 6-digit link code (10 minutes) to
        `email` if an account exists. Always `200 accepted` for a valid ticket
        (no enumeration). `400 INVALID_LINK_TICKET` when the ticket is
        tampered or expired.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthLinkRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/oauth/link/verify:
    post:
      tags: [Auth]
      operationId: postAuthOAuthLinkVerify
      summary: Link the provider identity to an existing account and sign in
      description: |
        Verifies the link code, links the ticket's identity to the account and
        returns tokens. Same `MFA_REQUIRED` / `totp_code` round-trip as login
        (the code stays valid until it succeeds). Errors: `400 INVALID_LINK_TICKET`,
        `400 INVALID_EMAIL_CODE`, `409 CONFLICT` (identity linked elsewhere or
        the account already has another identity for this provider),
        `403 ACCOUNT_DEACTIVATED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthLinkVerifyRequest"
      responses:
        "200":
          description: Linked and authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/oauth/link/create:
    post:
      tags: [Auth]
      operationId: postAuthOAuthLinkCreate
      summary: Create a new account for the provider identity and sign in
      description: |
        "No, I don't have an account": creates the account exactly like an
        OAuth sign-up (registration policy, default role, welcome email) with
        the ticket's relay email, links the identity and returns tokens.
        Retrying with the same ticket signs into the account created by the
        first call. Errors: `400 INVALID_LINK_TICKET`, `403 FORBIDDEN`
        (registration disabled), `409 CONFLICT` (email registered meanwhile).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthLinkCreateRequest"
      responses:
        "200":
          description: Created and authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/account/deactivate/request:
    post:
      tags: [Auth]
      operationId: postAuthAccountDeactivateRequest
      summary: Email an account-deletion confirmation code
      description: |
        Sends a 6-digit confirmation code (10 minutes) to the caller's email.
        Intended for passwordless accounts (Apple / Google / email code) that
        cannot complete a password / passkey / TOTP step-up.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/account/deactivate:
    post:
      tags: [Auth]
      operationId: postAuthAccountDeactivate
      summary: Delete (deactivate) own account
      description: |
        Account deletion keeps all data: the user becomes `disabled` with
        `deactivated_at`, every refresh session is revoked, stored Apple
        refresh tokens are revoked via Apple `/auth/revoke` (best effort), and
        every sign-in path returns `403 ACCOUNT_DEACTIVATED` afterwards.

        Confirm with either a recent step-up grant (`/v1/auth/step-up/*`,
        send `{}`) or `code` from `/v1/auth/account/deactivate/request`.
        Without either → `403 STEP_UP_REQUIRED`. Wrong code →
        `400 INVALID_EMAIL_CODE`. The last super admin gets `409 CONFLICT`.
        Refused while impersonating (`403 FORBIDDEN`). A platform admin can
        reactivate the user by setting status `active`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeactivateRequest"
      responses:
        "200":
          description: Deactivated (`data.status = deactivated`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/qr/sessions:
    post:
      tags: [Auth]
      operationId: postAuthQRSession
      summary: Start a QR sign-in (web login page)
      description: |
        Creates a short-lived (120 s) QR sign-in session for the calling browser
        tab. Render `qr_url` (`{frontend}/login/qr/{session_id}`) as a QR; the
        signed-in mobile app opens it (universal link or in-app scanner).

        Keep `browser_secret` in the tab only: it is required to read the state
        and to exchange an approval. `realtime` holds an **anonymous** Centrifugo
        connection token (`sub: ""`) and a subscription token for exactly one
        private channel `qrlogin:{random}` (unrelated to the session id). Both
        expire 30 s after the session. Channel events (`data.type`):
        `scanned`, `approved` (with `exchange_token`), `rejected`.

        The request's User-Agent and client IP (first `X-Forwarded-For` hop) are
        stored for the approval screen. Errors: `429 RATE_LIMITED` (60 / 15 min
        per IP), `503 REALTIME_DISABLED`.
      security: []
      responses:
        "201":
          description: QR session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRLoginCreated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: Realtime disabled
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/qr/sessions/{id}:
    get:
      tags: [Auth]
      operationId: getAuthQRSession
      summary: QR sign-in details (mobile)
      description: |
        Shows who is asking to sign in: browser / OS parsed from the web
        request's User-Agent, its IP and approximate location (`null` when
        unknown), created / expiry time. The first signed-in viewer claims the
        session; other accounts then get `409 QR_SESSION_CLAIMED`.

        Errors: `404 QR_SESSION_NOT_FOUND` (unknown / expired / used),
        `409 QR_SESSION_CLAIMED`, `429 RATE_LIMITED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QRSessionID"
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRLoginDetails"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/qr/sessions/{id}/approve:
    post:
      tags: [Auth]
      operationId: postAuthQRSessionApprove
      summary: Approve a QR sign-in (mobile)
      description: |
        Signs the waiting browser tab in as the caller.
        Publishes `{type: "approved", exchange_token}` to the tab's channel;
        the exchange window is 60 s. Exactly one approve / reject succeeds.

        Errors: `403 ACCOUNT_DEACTIVATED`, `403 FORBIDDEN` (impersonating or
        disabled), `404 QR_SESSION_NOT_FOUND`, `409 QR_SESSION_RESOLVED`,
        `409 QR_SESSION_CLAIMED`, `429 RATE_LIMITED`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QRSessionID"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/qr/sessions/{id}/reject:
    post:
      tags: [Auth]
      operationId: postAuthQRSessionReject
      summary: Reject a QR sign-in (mobile)
      description: |
        Publishes `{type: "rejected"}` to the tab's channel. Errors as approve
        (no account-state check).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QRSessionID"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/qr/sessions/{id}/state:
    post:
      tags: [Auth]
      operationId: postAuthQRSessionState
      summary: QR sign-in state for the owning tab
      description: |
        Read once after the tab (re)subscribes to its channel so an event sent
        while the socket was down is not lost. Not meant for polling. Wrong
        secrets count against 5 attempts, after which the session is deleted.

        Errors: `400 QR_LOGIN_INVALID`, `404 QR_SESSION_NOT_FOUND`,
        `429 RATE_LIMITED`.
      security: []
      parameters:
        - $ref: "#/components/parameters/QRSessionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [browser_secret]
              additionalProperties: false
              properties:
                browser_secret: { type: string }
      responses:
        "200":
          description: Current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRLoginState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/qr/exchange:
    post:
      tags: [Auth]
      operationId: postAuthQRExchange
      summary: Redeem an approved QR sign-in (web server)
      description: |
        Called by the web server (NextAuth `qr-login` credentials provider), not
        by browser JS (the BFF blocks it). Needs the session id, the tab's
        `browser_secret` and the `exchange_token` from the approval event.
        Single use: the session is deleted on success. Returns the same token
        pair as `/v1/auth/login` plus the signed-in user. The session row keeps
        the User-Agent / IP of the browser that showed the QR.

        Errors: `400 QR_LOGIN_INVALID` (wrong secret / token, not approved yet),
        `404 QR_SESSION_NOT_FOUND`, `403 ACCOUNT_DEACTIVATED`,
        `429 RATE_LIMITED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QRLoginExchangeRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRLoginExchanged"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/notifications:
    get:
